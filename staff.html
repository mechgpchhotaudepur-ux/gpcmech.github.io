<h1>Staff of the department</h1><p class="dd-sub">Faculty, technical and supporting staff of the Mechanical Engineering department.</p>
<div class="dd-cards" id="cards"></div><input class="dd-search" id="q" placeholder="Search name, qualification, area"><div class="dd-scroll" id="t"></div>
</div>
<script src="assets/dept-data.js"></script>
<script>
ddLoad("data/staff.json").then(function (rows) {
  var by = ddCount(rows, "role");
  ddCards(document.getElementById("cards"), [[rows.length, "Total staff"], [by["Faculty"] || 0, "Faculty"], [by["Technical staff"] || 0, "Technical staff"], [by["Supporting staff"] || 0, "Supporting staff"]]);
  var t = document.getElementById("t");
  ddTable(t, [["Name", "name"], ["Designation", "designation"], ["Qualification", "qualification"], ["Area of specialisation", "specialization"], ["Joined institute", "joined_institute"]], rows);
  ddSearch(document.getElementById("q"), t);
}).catch(function (e) { document.getElementById("t").textContent = e.message; });
</script></body></html>
