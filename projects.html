<h1>Student projects</h1><p class="dd-sub">Final-year projects of the department: title, guide and group size.</p>
<div class="dd-cards" id="cards"></div><input class="dd-search" id="q" placeholder="Search title, guide, year"><div class="dd-scroll" id="t"></div>
</div>
<script src="assets/dept-data.js"></script>
<script>
ddLoad("data/projects.json").then(function (rows) {
  rows.forEach(function (r) { r.report = r.report_available ? "Yes" : ""; });
  var by = ddCount(rows, "academic_year");
  ddCards(document.getElementById("cards"), [[rows.length, "Projects listed"], [Object.keys(ddCount(rows, "guide")).length, "Guides"]].concat(Object.keys(by).sort().map(function (k) { return [by[k], k]; })));
  var t = document.getElementById("t");
  ddTable(t, [["Academic year", "academic_year"], ["Project", "title"], ["Guide", "guide"], ["Students", "students"], ["Report on file", "report"]], rows);
  ddSearch(document.getElementById("q"), t);
}).catch(function (e) { document.getElementById("t").textContent = e.message; });
</script></body></html>
