<h1>Faculty training and development</h1><p class="dd-sub">Training programmes, courses and industrial training attended by the faculty (2023-24 to 2025-26).</p>
<div class="dd-cards" id="cards"></div><input class="dd-search" id="q" placeholder="Search faculty, programme, organiser"><div class="dd-scroll" id="t"></div>
</div>
<script src="assets/dept-data.js"></script>
<script>
ddLoad("data/training.json").then(function (rows) {
  var by = ddCount(rows, "year"), fac = Object.keys(ddCount(rows, "faculty")).length;
  ddCards(document.getElementById("cards"), [[rows.length, "Programmes recorded"], [fac, "Faculty members"], [by["2023-24"] || 0, "in 2023-24"], [by["2024-25"] || 0, "in 2024-25"], [by["2025-26"] || 0, "in 2025-26"]]);
  var t = document.getElementById("t");
  ddTable(t, [["Year", "year"], ["Faculty", "faculty"], ["Programme", "programme"], ["Organiser", "organiser"], ["Period", "period"], ["Duration", "duration"]], rows);
  ddSearch(document.getElementById("q"), t);
}).catch(function (e) { document.getElementById("t").textContent = e.message; });
</script></body></html>
